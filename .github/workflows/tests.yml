name: tests
# 审计结论："10/10 仓库零 CI —— 你的验证全靠人记得跑"。
# 这个工作流把"我说通过"换成"机器说通过"：每次 push / PR 都在一台干净机器上重跑。
# 判定成败的唯一依据是退出码（0 = 成功），不读任何打印信息。
#
# ⚠️ 覆盖边界（B-23）：CI 只装 requirements-dev.txt（pytest + pyflakes），
#    所以下面三条 GUI 测试在这里**必然 skip**，只在本地装了 PySide2 的 3.10 环境时才跑：
#      · test_main_import_still_works_when_gui_stack_is_available
#      · test_gui_windows_construct_offscreen
#      · test_gui_full_calculation_flow          ← B-07 的回归测试，最重要的一条
#    也就是说"CI 绿"只证明计算核心与仓库卫生，不证明界面。要覆盖 GUI，要么在本地
#    跑 run_tests.ps1（它会显式提示哪些被 skip 了），要么照 docs/改进操作说明书.md 里
#    记的配方补一条 Linux + PySide2 + offscreen 的 job（未验证，故未加入流水线）。

on:
  push:
  pull_request:
  workflow_dispatch:        # 也允许在 Actions 页面手动点一次

# 最小权限：CI 只需要读代码
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # B-22 的同类防线：把整条流水线的 IO 编码固定成 UTF-8，
    # 免得"本地 cp936 / CI utf-8"这种环境差异造出假红假绿。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = 运行/打包环境；3.12 = 证明计算核心不依赖老版本解释器
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只装测试依赖：GUI 依赖（PySide2==5.15.2.1）在 3.11+ 上装不上，
      # 装它会让整条流水线因为无关原因变红。
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 计算核心等价性回归（零依赖入口）
        run: python src/core.py

      # -rs：把 skip 的原因写进日志，让"哪一块没被覆盖"在每次运行里都可见
      - name: 计算核心正确性验证（对照公开参考值）
        run: python -m pytest -q -rs

      # tests/ 覆盖不到 GUI：main.py 依赖 PySide2，CI 里装不上也跑不起来。
      # 至少做语法编译，避免把写错的文件推上去。
      - name: 语法检查（含 GUI 入口）
        run: python -m py_compile main.py src/core.py src/ui/calculator1.py src/ui/unit.py src/ui/about.py legacy/sample.py

      # 静态检查只覆盖承载真实逻辑的两个文件；calculator1/unit/about 是 pyuic 生成的，
      # sample.py 是保留的历史参考实现，它们的既有告警不代表回归。
      - name: 静态检查（未定义名/未使用导入）
        run: python -m pyflakes main.py src/core.py
