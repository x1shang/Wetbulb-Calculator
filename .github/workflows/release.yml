name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要重新发布的既有 tag（例如 v1.3.3）'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      # 手动重发布必须检出输入的那个 tag，否则打包的是分支上的代码
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Check tag and version
        shell: pwsh
        run: |
          # tag push 用 push 的 tag；手动重发布用 workflow_dispatch 的输入
          # （手动触发时 GITHUB_REF_NAME 是分支名 master，不能拿来做 tag 校验）
          $version = "${{ inputs.version }}".Trim()
          if (-not $version) { $version = $env:GITHUB_REF_NAME }
          if ($version -notmatch '^v\d') { throw "Not a release tag: '$version'" }
          "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $core = python src/cli.py --version
          if ($core -ne $version) { throw "Tag/core version mismatch: tag=$version core=$core" }
      - run: python -m pip install -r requirements-build.txt
      - run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/THIRD_PARTY_LICENSES.txt
            dist/example.xlsx
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish tested assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            # 重跑：只覆盖资产，保持 Release 已发布的说明与顺序不变
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --verify-tag \
              --title "$tag 湿球计算器" --notes-file RELEASE_NOTES.md
          fi
